services:
    nginx:
        extends:
            file: docker-compose.base.yml
            service: nginx
        volumes:
            - static_volume:/var/www/loyalty/static
        depends_on:
            - api
            - swagger-ui

    swagger-ui:
        extends:
            file: docker-compose.base.yml
            service: swagger-ui
        depends_on:
            - api

    migrations:
        extends:
            file: docker-compose.base.yml
            service: migrations
        depends_on:
            db:
                condition: service_healthy

    api:
        extends:
            file: docker-compose.base.yml
            service: api
        volumes:
            - static_volume:/home/app/src/loyalty/presentation/web/static
        depends_on:
            migrations:
                condition: service_completed_successfully
            db:
                condition: service_healthy
            nginx-s3-gateway:
                condition: service_started

    db:
        extends:
            file: docker-compose.base.yml
            service: db
        volumes:
            - pg_data:/var/lib/postgresql/data/

    minio:
        extends:
            file: docker-compose.base.yml
            service: minio
        volumes:
            - minio_data:/data

    nginx-s3-gateway:
        extends:
            file: docker-compose.base.yml
            service: nginx-s3-gateway
        depends_on:
            minio:
                condition: service_healthy

volumes:
    pg_data:
    static_volume:
    minio_data:
